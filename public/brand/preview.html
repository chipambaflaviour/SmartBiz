<!doctype html><html><head><meta charset="utf-8"><title>SmartBiz brand</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Inter,system-ui,sans-serif;background:#eef2f7;color:#0b1c30}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;padding:24px;max-width:1100px;margin:0 auto}
.card{background:#fff;border-radius:16px;padding:28px;box-shadow:0 1px 3px rgba(11,28,48,.08)}
.card.dark{background:#111722}
h3{margin:0 0 16px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#6b7a79}
.dark h3{color:#8fb1ae}
.row{display:flex;align-items:center;gap:28px;flex-wrap:wrap}
.sizes{display:flex;align-items:flex-end;gap:22px}
.sizes figure{margin:0;text-align:center;font-size:11px;color:#6b7a79}
.sizes img{display:block;margin:0 auto 6px}
.pal{display:flex;gap:10px}.pal div{width:64px;height:64px;border-radius:12px;display:flex;align-items:flex-end;padding:6px;font-size:9px;color:#fff;box-sizing:border-box}
</style></head><body>
<div class="grid">
  <div class="card"><h3>Primary lockup</h3><img src="smartbiz-logo.svg" width="320" alt=""></div>
  <div class="card dark"><h3>On dark</h3><img src="smartbiz-logo-white.svg" width="320" alt=""></div>
  <div class="card"><h3>Stacked</h3><img src="smartbiz-logo-stacked.svg" width="240" alt=""></div>
  <div class="card"><h3>App icon &amp; favicon sizes</h3>
    <div class="sizes">
      <figure><img src="smartbiz-mark.svg" width="128" height="128">128</figure>
      <figure><img src="smartbiz-mark.svg" width="64" height="64">64</figure>
      <figure><img src="smartbiz-mark.svg" width="32" height="32">32</figure>
      <figure><img src="smartbiz-mark.svg" width="16" height="16">16</figure>
      <figure style="color:#006a67"><img src="smartbiz-mark-mono.svg" width="64" height="64" style="color:#006a67">mono</figure>
    </div></div>
  <div class="card"><h3>Palette</h3><div class="pal">
    <div style="background:#006a67">006a67</div><div style="background:#00CEC8">00CEC8</div><div style="background:#5af9f2;color:#00201f">5af9f2</div><div style="background:#0b1c30">0b1c30</div><div style="background:#111722">111722</div></div></div>
  <div class="card dark"><h3>Sidebar preview</h3>
    <div style="display:flex;align-items:center;gap:10px"><img src="smartbiz-mark.svg" width="36" height="36"><div><div style="color:#fff;font-weight:800;font-size:18px;letter-spacing:-.02em;line-height:1">SmartBiz</div><div style="color:#62e6df;font-size:10px;font-weight:600;letter-spacing:.16em;margin-top:4px">ENTERPRISE OS</div></div></div></div>
</div></body></html>
