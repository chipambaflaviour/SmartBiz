<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="SmartBiz">
  <defs>
    <linearGradient id="sb-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#19dcd6"/>
      <stop offset="1" stop-color="#006a67"/>
    </linearGradient>
    <linearGradient id="sb-sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#sb-tile)"/>
  <rect width="64" height="32" rx="16" fill="url(#sb-sheen)"/>
  <!-- Stacked "S": three layers of the Business OS -->
  <path d="M45 20H26a6 6 0 0 0 0 12h12a6 6 0 0 1 0 12H19" fill="none" stroke="#ffffff" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
